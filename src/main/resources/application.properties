# Perfil ativo: variável de ambiente SPRING_PROFILES_ACTIVE (padrão: dev)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Conexão com o banco (comum a todos os perfis)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fulls_bank}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# JWT: segredo HS256 (mínimo de 32 bytes) vem da variável de ambiente; a aplicação não sobe sem ele
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Primeiro administrador (opcional): criado na inicialização se as duas variáveis existirem
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# O esquema é criado pelas migrations do Flyway (db/migration); o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate

# Paginação (extrato): página padrão de 20 itens e no máximo 100 por página
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Documentação OpenAPI: interface em /swagger-ui.html e JSON em /v3/api-docs (públicas)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
